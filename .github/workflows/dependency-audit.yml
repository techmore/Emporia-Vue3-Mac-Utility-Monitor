name: Dependency security audit

on:
  push:
    paths:
      - requirements.lock
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - requirements.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated audit tool
        run: |
          python3 -m venv audit-venv
          audit-venv/bin/python -m pip install pip-audit==2.10.1
      - name: Audit every pinned runtime dependency
        run: audit-venv/bin/pip-audit -r requirements.lock --no-deps --disable-pip --strict
