name: Release Homebrew archive

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archive:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag and install locked dependencies
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          python3 -m venv venv
      - name: Build the Homebrew archive
        run: ./release.sh
      - name: Publish the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Emporia-Energy-Monitor-$(cat VERSION)-macos.zip" "dist/Emporia-Energy-Monitor-$(cat VERSION)-arm64-wheels.tar.gz" --title "Emporia Energy Monitor $(cat VERSION)" --notes-file CHANGELOG.md
