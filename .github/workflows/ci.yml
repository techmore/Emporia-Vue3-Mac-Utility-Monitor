name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: python3 -m venv venv

      - name: Install dependencies
        run: venv/bin/python3 -m pip install -r requirements.lock

      - name: Check release metadata
        run: venv/bin/python3 scripts/check_release.py

      - name: Syntax check
        run: venv/bin/python3 -m py_compile energy.py web.py aqara.py runtime_store.py panel_model.py climate.py climate_collect.py extensions.py radon.py ecosense.py panel_photos.py solar_model.py

      - name: Run unit tests
        run: venv/bin/python3 -m unittest discover -s tests -v

      - name: Smoke test Flask routes
        run: |
          venv/bin/python3 - <<'PY'
          import web
          client = web.app.test_client()
          for path in ['/', '/reports', '/guide', '/recommendations', '/circuits', '/trends', '/log', '/house', '/radon', '/panel/photos']:
              response = client.get(path, follow_redirects=True)
              assert response.status_code == 200, f"{path}: {response.status_code}"
          assert client.get('/api/menu-summary').status_code == 200
          assert client.get('/api/climate/replay?demo=1').status_code == 200
          PY

      - name: Compile and package release
        run: ./release.sh
